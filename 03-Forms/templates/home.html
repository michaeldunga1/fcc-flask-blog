{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
  <h1 class="mb-4">Latest posts</h1>
  {% for post in posts %}
    <article class="mb-4">
      <h2 class="h4">{{ post.title }}</h2>
      <p class="text-muted small">by {{ post.author }}</p>
      <p>{{ post.body }}</p>
    </article>
  {% else %}
    <p>No posts yet.</p>
  {% endfor %}
{% endblock %}
